name: V1 verification

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-workflow:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Windows current-user DPAPI signing workflow regressions
        shell: pwsh
        run: |
          ./scripts/Test-MemoraSigning.ps1
          ./scripts/Test-MemoraReleaseSafety.ps1
          ./scripts/Test-MemoraApk.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Test-MemoraSigning.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell DPAPI regressions failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Test-MemoraReleaseSafety.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell release safety regressions failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Test-MemoraApk.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell APK inspection regressions failed' }

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: chmod +x gradlew
      - run: ./gradlew -PcoreOnly=true :core:test --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-results-${{ github.sha }}
          path: core/build/reports/tests/test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Build R8/resource-shrunk verification APKs without the permanent signing key
        run: ./gradlew :app:assembleOptimizedCheck -PmemoraPhoneApks=true --no-configuration-cache --stacktrace
      - name: Inspect exact ARM64/universal contents and preserve bundled offline OCR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path app/build/reports/optimization -Force | Out-Null
          ./scripts/Measure-MemoraApks.ps1 -Arm64Apk app/build/outputs/apk/optimizedCheck/app-arm64-v8a-optimizedCheck.apk -UniversalApk app/build/outputs/apk/optimizedCheck/app-universal-optimizedCheck.apk -BaselineApk app/build/outputs/apk/debug/app-debug.apk -OutputPath app/build/reports/optimization/size-analysis.json
          if (-not (Test-Path app/build/outputs/mapping/optimizedCheck/mapping.txt)) { throw 'R8 mapping missing' }
          foreach ($apk in Get-ChildItem app/build/outputs/apk/optimizedCheck/*.apk) {
            & "$env:ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 $apk.FullName
            if ($LASTEXITCODE -ne 0) { throw '16 KB APK alignment failed' }
            & "$env:ANDROID_HOME/build-tools/36.0.0/apksigner" verify $apk.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Verification APK signature failed' }
          }
      - name: Release signing fails closed without the permanent identity
        shell: bash
        run: |
          mkdir -p app/build/reports/release-signing
          report=app/build/reports/release-signing
          if ./gradlew :app:assembleRelease --no-configuration-cache --console=plain > "$report/missing.log" 2>&1; then
            echo 'ERROR: release build succeeded without signing credentials'; exit 1
          fi
          grep -q 'Memora release signing requires:' "$report/missing.log"
          if find app/build/outputs/apk/release -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo 'ERROR: missing-credential build produced a release APK'; exit 1
          fi
          if RELEASE_KEYSTORE_PATH=/nonexistent/memora.p12 RELEASE_STORE_PASSWORD=synthetic-test RELEASE_KEY_PASSWORD=synthetic-test RELEASE_KEY_ALIAS=wrong-alias ./gradlew :app:verifyMemoraReleaseSigning --no-configuration-cache --console=plain > "$report/wrong-alias.log" 2>&1; then
            echo 'ERROR: wrong alias accepted'; exit 1
          fi
          grep -q 'Memora release alias must be memora-release' "$report/wrong-alias.log"
          if RELEASE_KEYSTORE_PATH=/nonexistent/memora.p12 RELEASE_STORE_PASSWORD=synthetic-test RELEASE_KEY_PASSWORD=synthetic-test RELEASE_KEY_ALIAS=memora-release ./gradlew :app:verifyMemoraReleaseSigning --no-configuration-cache --console=plain > "$report/wrong-path.log" 2>&1; then
            echo 'ERROR: wrong keystore path accepted'; exit 1
          fi
          grep -q 'Memora release requires the canonical' "$report/wrong-path.log"
          if RELEASE_STORE_PASSWORD=synthetic-test ./gradlew :app:verifyMemoraReleaseSigning --configuration-cache --console=plain > "$report/cache.log" 2>&1; then
            echo 'ERROR: signing secrets allowed in configuration cache'; exit 1
          fi
          grep -q 'Memora signing requires --no-configuration-cache' "$report/cache.log"
          echo 'Release signing negative checks passed (missing credentials, alias, path, configuration cache).'
      - name: Record debug APK checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-results-${{ github.sha }}
          path: app/build/reports
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: personal-library-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk*
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: memora-optimized-verification-${{ github.sha }}
          path: |
            app/build/outputs/apk/optimizedCheck/*.apk
            app/build/outputs/mapping/optimizedCheck
            app/build/reports/optimization

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace
            mkdir -p app/build/reports/branding
            adb exec-out run-as com.personallibrary.app cat files/memora-dark.png > app/build/reports/branding/memora-dark.png
            adb exec-out run-as com.personallibrary.app cat files/memora-light.png > app/build/reports/branding/memora-light.png
            python3 -c 'from pathlib import Path; files=list(Path("app/build/reports/branding").glob("*.png")); assert len(files)==2; assert all(p.read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a")) for p in files), "Invalid branding screenshot artifact"'
            ./gradlew :app:assembleOptimizedCheck -PmemoraPhoneApks=true --no-configuration-cache --stacktrace
            mkdir -p app/build/reports/optimized-launch
            adb install -r app/build/outputs/apk/optimizedCheck/app-universal-optimizedCheck.apk
            adb shell am force-stop com.personallibrary.app
            adb logcat -c
            adb shell am start -W -n com.personallibrary.app/com.example.MainActivity > app/build/reports/optimized-launch/start.txt
            grep -q 'Status: ok' app/build/reports/optimized-launch/start.txt
            sleep 3
            adb shell pidof com.personallibrary.app > app/build/reports/optimized-launch/pid.txt
            adb logcat -d > app/build/reports/optimized-launch/logcat.txt
            ./gradlew :app:connectedOptimizedCheckAndroidTest -PmemoraOptimizedTests=true --no-configuration-cache --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-results-${{ github.sha }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/reports/branding
            app/build/reports/optimized-launch
